<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="2400" height="1040">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e747a"/>
      <stop offset="1" stop-color="#4a4f54"/>
    </linearGradient>
    <linearGradient id="turret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777d83"/>
      <stop offset="1" stop-color="#52575c"/>
    </linearGradient>
    <radialGradient id="wheel" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#5d6268"/>
      <stop offset="1" stop-color="#3a3e42"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="600" cy="462" rx="470" ry="16" fill="#000" opacity="0.25"/>

  <!-- track loop -->
  <rect x="150" y="318" width="870" height="136" rx="66" fill="#26282a"/>
  <rect x="150" y="318" width="870" height="136" rx="66" fill="none" stroke="#3d4043" stroke-width="10" stroke-dasharray="6 9"/>
  <rect x="166" y="334" width="838" height="104" rx="52" fill="#1c1d1f"/>

  <!-- idler (rear) and drive sprocket (front) -->
  <circle cx="215" cy="384" r="40" fill="url(#wheel)" stroke="#222" stroke-width="4"/>
  <circle cx="215" cy="384" r="14" fill="#2e3134"/>
  <circle cx="952" cy="372" r="44" fill="url(#wheel)" stroke="#222" stroke-width="4"/>
  <circle cx="952" cy="372" r="44" fill="none" stroke="#2a2c2e" stroke-width="7" stroke-dasharray="8 6"/>
  <circle cx="952" cy="372" r="16" fill="#2e3134"/>

  <!-- return rollers -->
  <g fill="#3f4347" stroke="#222" stroke-width="3">
    <circle cx="330" cy="338" r="11"/><circle cx="500" cy="338" r="11"/>
    <circle cx="670" cy="338" r="11"/><circle cx="830" cy="338" r="11"/>
  </g>

  <!-- road wheels: 4 bogies x 2 -->
  <g stroke="#222" stroke-width="4">
    <g id="bogie">
      <rect x="262" y="392" width="88" height="14" rx="5" fill="#33373a"/>
      <circle cx="275" cy="414" r="30" fill="url(#wheel)"/>
      <circle cx="337" cy="414" r="30" fill="url(#wheel)"/>
      <circle cx="275" cy="414" r="10" fill="#2b2e31" stroke-width="2"/>
      <circle cx="337" cy="414" r="10" fill="#2b2e31" stroke-width="2"/>
    </g>
    <use href="#bogie" x="150"/>
    <use href="#bogie" x="300"/>
    <use href="#bogie" x="450"/>
  </g>

  <!-- lower hull -->
  <polygon points="165,328 1012,328 1048,296 1012,262 228,262 168,284" fill="url(#body)" stroke="#2f3236" stroke-width="4" stroke-linejoin="round"/>
  <!-- fender -->
  <rect x="170" y="318" width="845" height="11" fill="#3e4246" stroke="#2f3236" stroke-width="3"/>
  <!-- tool box & jack on fender -->
  <rect x="255" y="300" width="70" height="18" rx="2" fill="#565b60" stroke="#2f3236" stroke-width="3"/>
  <rect x="560" y="304" width="110" height="9" rx="4" fill="#6b5640" stroke="#2f3236" stroke-width="2"/>
  <!-- exhaust muffler -->
  <rect x="132" y="286" width="40" height="28" rx="8" fill="#4a3c33" stroke="#2f3236" stroke-width="3"/>

  <!-- superstructure -->
  <polygon points="300,262 300,216 868,216 905,236 905,262" fill="url(#body)" stroke="#2f3236" stroke-width="4" stroke-linejoin="round"/>
  <line x1="300" y1="219" x2="868" y2="219" stroke="#8a9096" stroke-width="3"/>
  <!-- driver visor -->
  <rect x="868" y="230" width="26" height="9" fill="#1e2022"/>
  <!-- side hatch -->
  <rect x="770" y="226" width="58" height="28" rx="3" fill="none" stroke="#33373a" stroke-width="3"/>

  <!-- gun barrel -->
  <rect x="772" y="172" width="335" height="12" fill="#43474b" stroke="#2a2c2e" stroke-width="3"/>
  <rect x="1100" y="165" width="36" height="26" rx="3" fill="#3c4044" stroke="#2a2c2e" stroke-width="3"/>
  <!-- turret -->
  <polygon points="418,216 446,140 702,140 738,176 742,216" fill="url(#turret)" stroke="#2f3236" stroke-width="4" stroke-linejoin="round"/>
  <line x1="448" y1="145" x2="700" y2="145" stroke="#8f959b" stroke-width="3"/>
  <!-- mantlet -->
  <rect x="736" y="156" width="42" height="44" rx="6" fill="#55595e" stroke="#2f3236" stroke-width="4"/>
  <!-- commander cupola -->
  <rect x="452" y="114" width="74" height="28" rx="7" fill="#5f6469" stroke="#2f3236" stroke-width="4"/>
  <rect x="460" y="122" width="58" height="5" fill="#1e2022"/>
  <!-- side hatch on turret -->
  <rect x="640" y="160" width="40" height="44" rx="3" fill="none" stroke="#3a3e42" stroke-width="3"/>

  <!-- markings -->
  <g transform="translate(560 180)">
    <rect x="-22" y="-7" width="44" height="14" fill="#f2f2f0"/>
    <rect x="-7" y="-22" width="14" height="44" fill="#f2f2f0"/>
    <rect x="-17" y="-3" width="34" height="6" fill="#111"/>
    <rect x="-3" y="-17" width="6" height="34" fill="#111"/>
  </g>
  <text x="490" y="196" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#e9e4d6" stroke="#222" stroke-width="1">4</text>
  <text x="602" y="196" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#e9e4d6" stroke="#222" stroke-width="1">21</text>

  <!-- antenna -->
  <line x1="350" y1="216" x2="300" y2="70" stroke="#2f3236" stroke-width="3"/>
</svg>
