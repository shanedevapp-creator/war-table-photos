<svg xmlns="http://www.w3.org/2000/svg" viewBox="125 150 495 710" width="990" height="1420">
  <!-- German infantryman 1940, advancing mid-stride, facing right. Field grey, Stahlhelm, Kar98k. -->
  <defs>
    <linearGradient id="tunic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a6e45"/>
      <stop offset="1" stop-color="#968a5c"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8470"/>
      <stop offset="1" stop-color="#5e6555"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="310" cy="826" rx="175" ry="13" fill="#000" opacity="0.25"/>

  <!-- far arm (behind body) -->
  <g transform="rotate(10 305 540)">
    <path d="M300,332 Q345,368 372,400" fill="none" stroke="#2c2f27" stroke-width="48" stroke-linecap="round"/>
    <path d="M372,400 Q404,420 434,428" fill="none" stroke="#2c2f27" stroke-width="39" stroke-linecap="round"/>
    <path d="M300,332 Q345,368 372,400" fill="none" stroke="#6a5f3c" stroke-width="40" stroke-linecap="round"/>
    <path d="M372,400 Q404,420 434,428" fill="none" stroke="#6a5f3c" stroke-width="31" stroke-linecap="round"/>
    <ellipse cx="446" cy="430" rx="15" ry="13" fill="#c89f7a" stroke="#2c2f27" stroke-width="4"/>
  </g>

  <!-- far leg: breeches tapering into the boot, heel raised -->
  <path d="M272,516 Q248,584 228,646 Q248,672 270,660 Q292,596 322,534 Z" fill="#625838" stroke="#2c2f27" stroke-width="3" stroke-linejoin="round"/>
  <path d="M230,652 Q214,706 194,764 L224,780 Q248,722 270,664 Q252,670 230,652 Z" fill="#6b5a3c" stroke="#2c2f27" stroke-width="3" stroke-linejoin="round"/>
  <g transform="rotate(24 208 786)">
    <path d="M182,776 Q186,768 204,768 L232,772 Q262,776 266,796 Q266,806 252,806 L188,806 Q178,798 182,776 Z" fill="#3a2a1e" stroke="#2c2f27" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- near leg: knee bent, foot planted -->
  <path d="M298,520 Q332,572 364,640 Q388,666 410,646 Q380,578 350,524 Z" fill="#7d7249" stroke="#2c2f27" stroke-width="3" stroke-linejoin="round"/>
  <path d="M366,646 Q350,700 360,790 L404,790 Q414,720 410,648 Q388,664 366,646 Z" fill="#7a6846" stroke="#2c2f27" stroke-width="3" stroke-linejoin="round"/>
  <path d="M352,786 L410,786 Q442,790 446,812 Q446,822 432,822 L356,822 Q346,806 352,786 Z" fill="#3a2a1e" stroke="#2c2f27" stroke-width="3" stroke-linejoin="round"/>
  <path d="M366,686 Q388,682 410,686" fill="none" stroke="#2c2f27" stroke-width="2" opacity="0.5"/>

  <!-- upper body, leaning into the advance -->
  <g transform="rotate(10 305 540)">
    <!-- gas-mask canister -->
    <g transform="rotate(14 236 430)">
      <rect x="214" y="372" width="44" height="124" rx="22" fill="#6e7258" stroke="#2c2f27" stroke-width="4"/>
      <path d="M218,402 Q236,406 254,402 M218,440 Q236,444 254,440 M218,472 Q236,476 254,472" fill="none" stroke="#4e5240" stroke-width="3"/>
    </g>

    <!-- tunic: rounded back and chest, cinched at the belt, skirt flaring -->
    <path d="M262,316 Q280,292 318,290 Q348,294 352,332 Q358,400 350,466 Q358,520 370,566 Q316,582 252,562 Q262,520 266,474 Q252,396 262,316 Z" fill="url(#tunic)" stroke="#2c2f27" stroke-width="4" stroke-linejoin="round"/>
    <path d="M286,306 Q276,390 288,462" fill="none" stroke="#6a5f3c" stroke-width="3" opacity="0.55"/>
    <path d="M300,500 Q304,536 300,566" fill="none" stroke="#6a5f3c" stroke-width="3" opacity="0.55"/>
    <!-- collar -->
    <path d="M298,292 Q318,288 338,296 L338,316 Q318,312 300,316 Z" fill="#5a5134" stroke="#2c2f27" stroke-width="3" stroke-linejoin="round"/>
    <!-- pocket flaps & buttons -->
    <path d="M318,350 Q332,346 346,350 L346,358 Q332,362 318,358 Z" fill="#867a4f" stroke="#2c2f27" stroke-width="2"/>
    <circle cx="347" cy="400" r="3" fill="#b8b8a8"/>
    <circle cx="348" cy="432" r="3" fill="#b8b8a8"/>
    <path d="M324,510 Q340,506 354,510 L355,519 Q340,523 325,519 Z" fill="#867a4f" stroke="#2c2f27" stroke-width="2"/>

    <!-- bread bag & canteen -->
    <g transform="rotate(12 270 486)">
      <rect x="248" y="486" width="52" height="58" rx="16" fill="#6e6a52" stroke="#2c2f27" stroke-width="3"/>
      <ellipse cx="256" cy="540" rx="18" ry="26" fill="#5a4a36" stroke="#2c2f27" stroke-width="3"/>
    </g>

    <!-- belt, pouches, Y-strap -->
    <path d="M264,466 Q308,472 352,464 L352,482 Q308,490 264,482 Z" fill="#5a3e28"/>
    <rect x="344" y="463" width="14" height="20" rx="3" fill="#8f938a" stroke="#2c2f27" stroke-width="2"/>
    <rect x="318" y="448" width="26" height="30" rx="8" fill="#5e4128" stroke="#111" stroke-width="2"/>
    <rect x="292" y="452" width="24" height="28" rx="8" fill="#5e4128" stroke="#111" stroke-width="2"/>
    <path d="M336,306 Q336,380 330,448" fill="none" stroke="#5a3e28" stroke-width="7" stroke-linecap="round"/>

    <!-- rifle (Kar98k) -->
    <g transform="rotate(-24 236 500)">
      <path d="M232,488 Q260,488 286,492 L286,508 Q258,514 234,522 Q226,505 232,488 Z" fill="#6e4a2c" stroke="#2a1c12" stroke-width="3" stroke-linejoin="round"/>
      <rect x="284" y="492" width="200" height="15" rx="6" fill="#7a5232" stroke="#2a1c12" stroke-width="3"/>
      <rect x="360" y="486" width="130" height="7" rx="3" fill="#2b2d2f"/>
      <rect x="484" y="494" width="116" height="7" rx="3" fill="#2b2d2f" stroke="#151617" stroke-width="2"/>
      <rect x="590" y="488" width="5" height="7" fill="#2b2d2f"/>
      <line x1="378" y1="488" x2="372" y2="476" stroke="#2b2d2f" stroke-width="5" stroke-linecap="round"/>
      <circle cx="372" cy="475" r="5" fill="#2b2d2f"/>
      <rect x="430" y="490" width="6" height="20" rx="2" fill="#3a3c3e"/>
    </g>

    <!-- near arm: fuller upper arm, slimmer forearm -->
    <path d="M316,330 Q296,376 306,418" fill="none" stroke="#2c2f27" stroke-width="52" stroke-linecap="round"/>
    <path d="M306,418 Q318,446 330,458" fill="none" stroke="#2c2f27" stroke-width="41" stroke-linecap="round"/>
    <path d="M316,330 Q296,376 306,418" fill="none" stroke="#857a50" stroke-width="44" stroke-linecap="round"/>
    <path d="M306,418 Q318,446 330,458" fill="none" stroke="#857a50" stroke-width="33" stroke-linecap="round"/>
    <path d="M296,402 Q306,416 318,418" fill="none" stroke="#625838" stroke-width="3" stroke-linecap="round"/>
    <path d="M322,446 Q332,442 340,446" fill="none" stroke="#625838" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="337" cy="463" rx="15" ry="13" fill="#d2aa85" stroke="#2c2f27" stroke-width="4"/>

    <!-- head -->
    <g transform="rotate(-6 318 290)">
      <path d="M306,262 Q318,270 330,262 L332,300 L306,300 Z" fill="#c89f7a" stroke="#2c2f27" stroke-width="4" stroke-linejoin="round"/>
      <path d="M296,226 Q300,190 332,192 Q356,196 360,226 Q362,236 370,248 Q366,255 358,255 Q358,272 349,280 Q338,288 324,286 Q304,284 298,262 Z" fill="#d6ae88" stroke="#2c2f27" stroke-width="4" stroke-linejoin="round"/>
      <path d="M340,233 L352,231" stroke="#2a1e16" stroke-width="3" stroke-linecap="round"/>
      <circle cx="347" cy="239" r="3" fill="#2a1e16"/>
      <path d="M340,269 Q347,266 353,268" fill="none" stroke="#7a5a44" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="314" cy="254" rx="9" ry="12" fill="#cfa47e" stroke="#2c2f27" stroke-width="3"/>
      <path d="M314,248 Q309,254 314,260" fill="none" stroke="#a9805f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M302,232 Q308,262 318,286" fill="none" stroke="#5e4128" stroke-width="3"/>
      <path d="M272,234 Q282,230 288,228 Q288,168 328,164 Q364,168 366,222 Q378,224 384,230 Q370,238 350,234 L304,236 Q284,240 272,234 Z" fill="url(#helmet)" stroke="#2c2f27" stroke-width="4" stroke-linejoin="round"/>
      <path d="M294,186 Q326,142 360,180" fill="none" stroke="#2c2f27" stroke-width="13" stroke-linecap="round"/><path d="M294,186 Q326,142 360,180" fill="none" stroke="#6b7360" stroke-width="7" stroke-linecap="round"/><circle cx="350" cy="206" r="6" fill="#b5a46a" stroke="#2c2f27" stroke-width="2"/>
      
    </g>
  </g>
</svg>
